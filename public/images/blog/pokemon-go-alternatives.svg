<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A dark map view with seven location pins in different colors and sizes, one prominently glowing at the center">
  <defs>
    <radialGradient id="pbg" cx="0.5" cy="0.5" r="0.9">
      <stop offset="0" stop-color="#151826"/>
      <stop offset="1" stop-color="#08090c"/>
    </radialGradient>
    <linearGradient id="pmain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9FF66"/>
      <stop offset="1" stop-color="#3FD4C5"/>
    </linearGradient>
    <radialGradient id="pglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B9FF66" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#B9FF66" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pgrid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1c1f2a" stroke-width="1"/>
    </pattern>
    <symbol id="pin" viewBox="-40 -50 80 100">
      <path d="M 0 -50 C -28 -50 -50 -28 -50 0 C -50 28 0 50 0 50 C 0 50 50 28 50 0 C 50 -28 28 -50 0 -50 Z"
            transform="scale(0.7)" stroke="#08090c" stroke-width="4"/>
      <circle r="8" cy="-6" fill="#08090c"/>
    </symbol>
  </defs>

  <rect width="1024" height="1024" fill="url(#pbg)"/>
  <rect width="1024" height="1024" fill="url(#pgrid)" opacity="0.55"/>

  <!-- Subtle "streets" — a couple of diagonal lines suggesting an abstract map -->
  <g stroke="#1c1f2a" stroke-width="10" opacity="0.55">
    <line x1="-100" y1="220" x2="1124" y2="380"/>
    <line x1="-100" y1="640" x2="1124" y2="500"/>
    <line x1="220" y1="-100" x2="380" y2="1124"/>
    <line x1="720" y1="-100" x2="640" y2="1124"/>
  </g>

  <!-- Radar around the featured pin -->
  <g transform="translate(512, 520)" fill="none" stroke="url(#pmain)">
    <circle r="110" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="190" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle r="290" stroke-opacity="0.12" stroke-width="1.5"/>
  </g>
  <ellipse cx="512" cy="560" rx="200" ry="50" fill="url(#pglow)"/>

  <!-- 6 smaller pins scattered, each a different color = each a different game -->
  <use href="#pin" x="230" y="260" width="90" height="112" fill="#4CC7FF"/>
  <use href="#pin" x="760" y="230" width="80" height="100" fill="#6b6f7e" opacity="0.55"/>
  <use href="#pin" x="180" y="580" width="80" height="100" fill="#FFB84D"/>
  <use href="#pin" x="820" y="500" width="80" height="100" fill="#FF7DAA"/>
  <use href="#pin" x="290" y="820" width="80" height="100" fill="#F4E14C"/>
  <use href="#pin" x="720" y="820" width="80" height="100" fill="#8BC96A"/>

  <!-- The featured pin — bigger, lime -->
  <g transform="translate(512, 520)">
    <path d="M 0 -110 C -60 -110 -108 -62 -108 -2 C -108 60 0 138 0 138 C 0 138 108 60 108 -2 C 108 -62 60 -110 0 -110 Z"
          fill="url(#pmain)" stroke="#08090c" stroke-width="6"/>
    <circle r="26" cy="-14" fill="#08090c"/>
    <circle r="8" cy="-14" fill="url(#pmain)"/>
  </g>

  <!-- Small "faded" label above the greyed pin to signal 'discontinued' -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#6b6f7e">
    <text x="800" y="215" font-size="12" letter-spacing="2" text-anchor="middle">OFFLINE 2022</text>
  </g>

  <!-- Corner mono labels -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#B9FF66">
    <text x="60" y="70" font-size="22" letter-spacing="3">7 AR GAMES</text>
    <text x="60" y="98" font-size="16" fill="#5a5f6e" letter-spacing="2">1 OPEN ECONOMY</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#5a5f6e" text-anchor="end">
    <text x="964" y="964" font-size="14" letter-spacing="2">SEEKPROTOCOL</text>
  </g>
</svg>
