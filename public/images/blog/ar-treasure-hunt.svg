<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A coordinate pin surrounded by radar rings, with an AR waypoint hexagon floating above">
  <defs>
    <radialGradient id="tbg" cx="0.5" cy="0.6" r="0.9">
      <stop offset="0" stop-color="#151826"/>
      <stop offset="1" stop-color="#08090c"/>
    </radialGradient>
    <linearGradient id="tacc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9FF66"/>
      <stop offset="1" stop-color="#3FD4C5"/>
    </linearGradient>
    <linearGradient id="tacc2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FD4C5"/>
      <stop offset="1" stop-color="#7A6BFF"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B9FF66" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B9FF66" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tgrid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1c1f2a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" fill="url(#tbg)"/>
  <rect width="1024" height="1024" fill="url(#tgrid)" opacity="0.55"/>

  <!-- Radar rings around the pin position -->
  <g transform="translate(512, 660)" fill="none" stroke="url(#tacc)">
    <circle r="120" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="220" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle r="340" stroke-opacity="0.14" stroke-width="1.5"/>
    <circle r="470" stroke-opacity="0.08" stroke-width="1.5"/>
  </g>

  <!-- Ground glow beneath the pin -->
  <ellipse cx="512" cy="720" rx="260" ry="60" fill="url(#tglow)"/>

  <!-- Coordinate crosshair -->
  <g stroke="url(#tacc)" stroke-opacity="0.55" stroke-width="1.2">
    <line x1="512" y1="600" x2="512" y2="720"/>
    <line x1="452" y1="660" x2="572" y2="660"/>
  </g>

  <!-- The pin -->
  <g transform="translate(512, 660)">
    <path d="M 0 -110 C -60 -110 -108 -62 -108 -2 C -108 60 0 138 0 138 C 0 138 108 60 108 -2 C 108 -62 60 -110 0 -110 Z"
          fill="url(#tacc)" stroke="#08090c" stroke-width="6"/>
    <circle r="26" cy="-14" fill="#08090c"/>
    <circle r="8" cy="-14" fill="url(#tacc)"/>
  </g>

  <!-- AR object floating above (hex coin, tilted) -->
  <g transform="translate(512, 340)">
    <g transform="rotate(-12)">
      <polygon points="0,-116 100,-58 100,58 0,116 -100,58 -100,-58"
               fill="none" stroke="url(#tacc2)" stroke-opacity="0.4" stroke-width="2"/>
      <polygon points="0,-96 82,-48 82,48 0,96 -82,48 -82,-48"
               fill="url(#tacc2)"/>
      <polygon points="0,-96 82,-48 0,0 -82,-48"
               fill="#ffffff" fill-opacity="0.12"/>
      <text x="0" y="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
            font-size="52" fill="#08090c" text-anchor="middle" font-weight="700">✦</text>
    </g>
  </g>

  <!-- Faint connection line pin ↔ AR object -->
  <line x1="512" y1="450" x2="512" y2="560" stroke="url(#tacc)" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Corner mono label — pretend coordinate + claim radius -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#B9FF66">
    <text x="60" y="70" font-size="22" letter-spacing="3">52.3676° N · 4.9041° E</text>
    <text x="60" y="98" font-size="16" fill="#5a5f6e" letter-spacing="2">CLAIM · RADIUS 30M · AVAILABLE</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#5a5f6e" text-anchor="end">
    <text x="964" y="964" font-size="14" letter-spacing="2">SEEKPROTOCOL</text>
  </g>
</svg>
